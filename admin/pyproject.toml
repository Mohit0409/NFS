[project]
name = "new-gym-platform"
version = "0.1.0"
description = "Portable New Gym admin and operations backend"
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<51"]

[project.optional-dependencies]
firebase = ["firebase-admin>=7.5,<8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.new-gym]
entrypoint = "python -m server.gravity"
